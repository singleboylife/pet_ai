<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理 - 宠派管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f5f5; }

    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header h1 { font-size: 24px; color: #333; margin-bottom: 10px; }
    .header .stats { display: flex; gap: 20px; margin-top: 20px; }
    .stat-card { flex: 1; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 8px; color: #fff; }
    .stat-card.orange { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .stat-card.green { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .stat-card.blue { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    .stat-card h3 { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: bold; }

    .filters { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .filters .row { display: flex; gap: 15px; align-items: center; }
    .filters select, .filters input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    .filters button { padding: 8px 20px; background: #667eea; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .filters button:hover { background: #5568d3; }

    .table-container { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #f8f9fa; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { font-weight: 600; color: #666; }
    tbody tr:hover { background: #f8f9fa; }

    .status { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .status.pending { background: #fff3cd; color: #856404; }
    .status.paid { background: #d1ecf1; color: #0c5460; }
    .status.shipped { background: #d4edda; color: #155724; }
    .status.completed { background: #d4edda; color: #155724; }
    .status.cancelled { background: #f8d7da; color: #721c24; }

    .actions button { padding: 5px 12px; margin-right: 5px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-view { background: #667eea; color: #fff; }
    .btn-ship { background: #28a745; color: #fff; }
    .btn-complete { background: #17a2b8; color: #fff; }
    .btn-cancel { background: #dc3545; color: #fff; }
    .btn-status { background: #ffc107; color: #333; }
    .btn-view:hover { background: #5568d3; }
    .btn-ship:hover { background: #218838; }
    .btn-complete:hover { background: #138496; }
    .btn-cancel:hover { background: #c82333; }
    .btn-status:hover { background: #e0a800; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
    .modal.active { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: #fff; border-radius: 8px; padding: 30px; max-width: 800px; max-height: 90vh; overflow-y: auto; width: 90%; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { font-size: 20px; color: #333; }
    .close { font-size: 28px; cursor: pointer; color: #999; }
    .close:hover { color: #333; }

    .order-detail { margin-top: 20px; }
    .detail-section { margin-bottom: 20px; }
    .detail-section h3 { font-size: 16px; color: #333; margin-bottom: 10px; border-bottom: 2px solid #667eea; padding-bottom: 5px; }
    .detail-row { display: flex; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .detail-label { width: 120px; color: #666; font-size: 14px; }
    .detail-value { flex: 1; color: #333; font-size: 14px; }

    .product-item { display: flex; gap: 15px; padding: 10px; background: #f8f9fa; border-radius: 4px; margin-bottom: 10px; }
    .product-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    .product-info { flex: 1; }
    .product-name { font-size: 14px; color: #333; margin-bottom: 5px; }
    .product-meta { font-size: 12px; color: #666; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #333; }
    .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .form-actions button { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #667eea; color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-primary:hover { background: #5568d3; }
    .btn-secondary:hover { background: #5a6268; }

    .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 20px; padding: 20px; }
    .pagination button { padding: 8px 15px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; }
    .pagination button:hover { background: #f0f0f0; }
    .pagination button.active { background: #667eea; color: #fff; border-color: #667eea; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📦 订单管理</h1>
      <div class="stats">
        <div class="stat-card">
          <h3>总订单数</h3>
          <div class="value" id="totalOrders">0</div>
        </div>
        <div class="stat-card orange">
          <h3>待发货</h3>
          <div class="value" id="paidOrders">0</div>
        </div>
        <div class="stat-card green">
          <h3>已发货</h3>
          <div class="value" id="shippedOrders">0</div>
        </div>
        <div class="stat-card blue">
          <h3>总收入</h3>
          <div class="value" id="totalRevenue">¥0</div>
        </div>
      </div>
    </div>

    <div class="filters">
      <div class="row">
        <select id="statusFilter">
          <option value="">全部状态</option>
          <option value="pending">待支付</option>
          <option value="paid">已支付</option>
          <option value="shipped">已发货</option>
          <option value="completed">已完成</option>
          <option value="cancelled">已取消</option>
        </select>
        <input type="text" id="keywordInput" placeholder="搜索订单号或用户名">
        <button onclick="loadOrders()">搜索</button>
        <button onclick="loadOrders()" style="background: #6c757d;">刷新</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>订单号</th>
            <th>用户</th>
            <th>金额</th>
            <th>状态</th>
            <th>支付方式</th>
            <th>下单时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="orderTableBody">
          <tr><td colspan="7" style="text-align: center; padding: 40px; color: #999;">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>

  <!-- 订单详情弹窗 -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>订单详情</h2>
        <span class="close" onclick="closeModal('detailModal')">&times;</span>
      </div>
      <div class="order-detail" id="orderDetail"></div>
    </div>
  </div>

  <!-- 发货弹窗 -->
  <div class="modal" id="shipModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>订单发货</h2>
        <span class="close" onclick="closeModal('shipModal')">&times;</span>
      </div>
      <form id="shipForm">
        <input type="hidden" id="shipOrderId">
        <div class="form-group">
          <label>物流公司</label>
          <select id="shippingCompany">
            <option value="顺丰速运">顺丰速运</option>
            <option value="中通快递">中通快递</option>
            <option value="圆通速递">圆通速递</option>
            <option value="申通快递">申通快递</option>
            <option value="韵达快递">韵达快递</option>
            <option value="邮政EMS">邮政EMS</option>
            <option value="京东物流">京东物流</option>
            <option value="德邦快递">德邦快递</option>
          </select>
        </div>
        <div class="form-group">
          <label>物流单号</label>
          <input type="text" id="trackingNumber" placeholder="请输入物流单号" required>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('shipModal')">取消</button>
          <button type="submit" class="btn-primary">确认发货</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 修改状态弹窗 -->
  <div class="modal" id="statusModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>修改订单状态</h2>
        <span class="close" onclick="closeModal('statusModal')">&times;</span>
      </div>
      <form id="statusForm">
        <input type="hidden" id="statusOrderId">
        <div class="form-group">
          <label>当前状态</label>
          <input type="text" id="currentStatus" disabled style="background: #f5f5f5;">
        </div>
        <div class="form-group">
          <label>新状态</label>
          <select id="newStatus" required>
            <option value="">请选择状态</option>
            <option value="pending">待支付</option>
            <option value="paid">已支付</option>
            <option value="shipped">已发货</option>
            <option value="completed">已完成</option>
            <option value="cancelled">已取消</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('statusModal')">取消</button>
          <button type="submit" class="btn-primary">确认修改</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://129.204.226.96:3000/api'
    const token = localStorage.getItem('token') || prompt('请输入管理员 Token:')
    if (token) localStorage.setItem('token', token)

    let currentPage = 1
    const pageSize = 20

    // 加载统计数据
    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/admin/orders/stats/summary`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        const data = await res.json()
        if (data.code === 200) {
          document.getElementById('totalOrders').textContent = data.data.total_orders || 0
          document.getElementById('paidOrders').textContent = data.data.paid_count || 0
          document.getElementById('shippedOrders').textContent = data.data.shipped_count || 0
          document.getElementById('totalRevenue').textContent = `¥${(data.data.total_revenue || 0).toFixed(2)}`
        }
      } catch (err) {
        console.error('加载统计失败:', err)
      }
    }

    // 加载订单列表
    async function loadOrders(page = 1) {
      currentPage = page
      const status = document.getElementById('statusFilter').value
      const keyword = document.getElementById('keywordInput').value.trim()

      try {
        const params = new URLSearchParams({ page, limit: pageSize })
        if (status) params.append('status', status)
        if (keyword) params.append('keyword', keyword)

        const res = await fetch(`${API_BASE}/admin/orders?${params}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        const data = await res.json()

        if (data.code === 200) {
          renderOrders(data.data.list, keyword)
          renderPagination(data.data.total)
        } else {
          alert(data.message)
        }
      } catch (err) {
        console.error('加载订单失败:', err)
        document.getElementById('orderTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: #f00;">加载失败</td></tr>'
      }
    }

    // 渲染订单列表
    function renderOrders(orders, keyword) {
      const tbody = document.getElementById('orderTableBody')
      if (!orders || orders.length === 0) {
        const msg = keyword ? `未找到包含 "${keyword}" 的订单` : '暂无订单数据'
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 40px; color: #999;">${msg}</td></tr>`
        return
      }

      tbody.innerHTML = orders.map(order => `
        <tr>
          <td>${order.order_no}</td>
          <td>${order.username || '-'}</td>
          <td>¥${order.total_amount}</td>
          <td><span class="status ${order.status}">${getStatusText(order.status)}</span></td>
          <td>${order.payment_method === 'wallet' ? '钱包' : order.payment_method === 'direct' ? '直接支付' : order.payment_method}</td>
          <td>${new Date(order.created_at).toLocaleString('zh-CN')}</td>
          <td class="actions">
            <button class="btn-view" onclick="viewOrder(${order.id})">查看</button>
            ${order.status === 'paid' ? `<button class="btn-ship" onclick="openShipModal(${order.id})">发货</button>` : ''}
            ${order.status === 'shipped' ? `<button class="btn-complete" onclick="completeOrder(${order.id})">完成</button>` : ''}
            ${['pending', 'paid'].includes(order.status) ? `<button class="btn-cancel" onclick="cancelOrder(${order.id})">取消</button>` : ''}
            <button class="btn-status" onclick="changeStatus(${order.id}, '${order.status}')">改状态</button>
          </td>
        </tr>
      `).join('')
    }

    // 渲染分页
    function renderPagination(total) {
      const totalPages = Math.ceil(total / pageSize)
      const pagination = document.getElementById('pagination')

      if (totalPages <= 1) {
        pagination.innerHTML = ''
        return
      }

      let html = ''
      if (currentPage > 1) {
        html += `<button onclick="loadOrders(${currentPage - 1})">上一页</button>`
      }

      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          html += `<button class="${i === currentPage ? 'active' : ''}" onclick="loadOrders(${i})">${i}</button>`
        } else if (i === currentPage - 3 || i === currentPage + 3) {
          html += '<span>...</span>'
        }
      }

      if (currentPage < totalPages) {
        html += `<button onclick="loadOrders(${currentPage + 1})">下一页</button>`
      }

      pagination.innerHTML = html
    }

    // 查看订单详情
    async function viewOrder(orderId) {
      try {
        const res = await fetch(`${API_BASE}/admin/orders/${orderId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        const data = await res.json()

        if (data.code === 200) {
          renderOrderDetail(data.data)
          document.getElementById('detailModal').classList.add('active')
        } else {
          alert(data.message)
        }
      } catch (err) {
        console.error('加载订单详情失败:', err)
        alert('加载失败')
      }
    }

    // 渲染订单详情
    function renderOrderDetail(order) {
      const address = order.address || {}
      const items = order.items || []

      document.getElementById('orderDetail').innerHTML = `
        <div class="detail-section">
          <h3>基本信息</h3>
          <div class="detail-row"><div class="detail-label">订单号:</div><div class="detail-value">${order.order_no}</div></div>
          <div class="detail-row"><div class="detail-label">用户:</div><div class="detail-value">${order.username}</div></div>
          <div class="detail-row"><div class="detail-label">订单金额:</div><div class="detail-value">¥${order.total_amount}</div></div>
          <div class="detail-row"><div class="detail-label">支付方式:</div><div class="detail-value">${order.payment_method === 'wallet' ? '钱包支付' : order.payment_method}</div></div>
          <div class="detail-row"><div class="detail-label">订单状态:</div><div class="detail-value"><span class="status ${order.status}">${getStatusText(order.status)}</span></div></div>
          <div class="detail-row"><div class="detail-label">下单时间:</div><div class="detail-value">${new Date(order.created_at).toLocaleString('zh-CN')}</div></div>
        </div>

        <div class="detail-section">
          <h3>收货信息</h3>
          <div class="detail-row"><div class="detail-label">收货人:</div><div class="detail-value">${address.name || '-'}</div></div>
          <div class="detail-row"><div class="detail-label">联系电话:</div><div class="detail-value">${address.phone || '-'}</div></div>
          <div class="detail-row"><div class="detail-label">收货地址:</div><div class="detail-value">${address.province || ''} ${address.city || ''} ${address.district || ''} ${address.detail || ''}</div></div>
        </div>

        ${order.shipping_company ? `
        <div class="detail-section">
          <h3>物流信息</h3>
          <div class="detail-row"><div class="detail-label">物流公司:</div><div class="detail-value">${order.shipping_company}</div></div>
          <div class="detail-row"><div class="detail-label">物流单号:</div><div class="detail-value">${order.tracking_number}</div></div>
          <div class="detail-row"><div class="detail-label">发货时间:</div><div class="detail-value">${order.shipped_at ? new Date(order.shipped_at).toLocaleString('zh-CN') : '-'}</div></div>
        </div>
        ` : ''}

        <div class="detail-section">
          <h3>商品清单</h3>
          ${items.map(item => `
            <div class="product-item">
              <img src="${item.image || '/static/default-product.png'}" alt="${item.name}">
              <div class="product-info">
                <div class="product-name">${item.name}</div>
                <div class="product-meta">单价: ¥${item.price} × ${item.quantity} = ¥${(item.price * item.quantity).toFixed(2)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `
    }

    // 打开发货弹窗
    function openShipModal(orderId) {
      document.getElementById('shipOrderId').value = orderId
      document.getElementById('shipForm').reset()
      document.getElementById('shipModal').classList.add('active')
    }

    // 关闭弹窗
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active')
    }

    // 提交发货
    document.getElementById('shipForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const orderId = document.getElementById('shipOrderId').value
      const shippingCompany = document.getElementById('shippingCompany').value
      const trackingNumber = document.getElementById('trackingNumber').value

      try {
        const res = await fetch(`${API_BASE}/admin/orders/${orderId}/ship`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ shipping_company: shippingCompany, tracking_number: trackingNumber })
        })
        const data = await res.json()

        if (data.code === 200) {
          alert('发货成功！')
          closeModal('shipModal')
          loadOrders(currentPage)
          loadStats()
        } else {
          alert(data.message)
        }
      } catch (err) {
        console.error('发货失败:', err)
        alert('发货失败')
      }
    })

    // 完成订单
    async function completeOrder(orderId) {
      if (!confirm('确认将订单标记为已完成？')) return

      try {
        const res = await fetch(`${API_BASE}/admin/orders/${orderId}/status`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ status: 'completed' })
        })
        const data = await res.json()

        if (data.code === 200) {
          alert('订单已完成！')
          loadOrders(currentPage)
          loadStats()
        } else {
          alert(data.message)
        }
      } catch (err) {
        console.error('操作失败:', err)
        alert('操作失败')
      }
    }

    // 取消订单
    async function cancelOrder(orderId) {
      if (!confirm('确认取消该订单？')) return

      try {
        const res = await fetch(`${API_BASE}/admin/orders/${orderId}/status`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ status: 'cancelled' })
        })
        const data = await res.json()

        if (data.code === 200) {
          alert('订单已取消！')
          loadOrders(currentPage)
          loadStats()
        } else {
          alert(data.message)
        }
      } catch (err) {
        console.error('操作失败:', err)
        alert('操作失败')
      }
    }

    // 修改订单状态
    async function changeStatus(orderId, currentStatus) {
      document.getElementById('statusOrderId').value = orderId
      document.getElementById('currentStatus').value = getStatusText(currentStatus)
      document.getElementById('newStatus').value = ''
      document.getElementById('statusModal').classList.add('active')
    }

    // 提交状态修改
    document.getElementById('statusForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const orderId = document.getElementById('statusOrderId').value
      const newStatus = document.getElementById('newStatus').value

      if (!newStatus) {
        alert('请选择新状态')
        return
      }

      try {
        const res = await fetch(`${API_BASE}/admin/orders/${orderId}/status`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ status: newStatus })
        })
        const data = await res.json()

        if (data.code === 200) {
          alert('状态修改成功！')
          closeModal('statusModal')
          loadOrders(currentPage)
          loadStats()
        } else {
          alert(data.message)
        }
      } catch (err) {
        console.error('操作失败:', err)
        alert('操作失败')
      }
    })

    // 状态文本映射
    function getStatusText(status) {
      const map = {
        pending: '待支付',
        paid: '已支付',
        shipped: '已发货',
        completed: '已完成',
        cancelled: '已取消'
      }
      return map[status] || status
    }

    // 初始化
    loadStats()
    loadOrders()
  </script>
</body>
</html>
